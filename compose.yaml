name: ${COMPOSE_PROJECT_NAME:-secondhand-marketplace}

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-secondhand-marketplace}-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: &backend-env
    APP_NAME: Secondhand Marketplace
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Supply a persistent APP_KEY in the private deployment env file}
    APP_URL: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:?Set the exact public host and optional port}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-marketplace_docker}
    DB_USERNAME: ${DB_USERNAME:-marketplace}
    DB_PASSWORD: ${DB_PASSWORD:?Supply a private application database password}
    DB_URL: ""
    CACHE_STORE: file
    SESSION_DRIVER: file
    SESSION_COOKIE: marketplace_session
    SESSION_LIFETIME: "120"
    SESSION_ENCRYPT: "true"
    SESSION_DOMAIN: "null"
    SESSION_PATH: /
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    SESSION_HTTP_ONLY: "true"
    SESSION_SAME_SITE: lax
    FRONTEND_URLS: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST}
    SANCTUM_STATEFUL_DOMAINS: ${PUBLIC_HOST}
    TRUSTED_PROXIES: ${NGINX_INTERNAL_IP:-172.30.14.10}
    QUEUE_CONNECTION: sync
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    MAIL_MAILER: log
    FILESYSTEM_DISK: public
    ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-}
    ZALOPAY_KEY1: ${ZALOPAY_KEY1:-}
    ZALOPAY_KEY2: ${ZALOPAY_KEY2:-}
    ZALOPAY_CREATE_URL: ${ZALOPAY_CREATE_URL:-https://openapi.zalopay.vn/v2/create}
    ZALOPAY_QUERY_URL: ${ZALOPAY_QUERY_URL:-https://openapi.zalopay.vn/v2/query}
    ZALOPAY_CALLBACK_URL: ${ZALOPAY_CALLBACK_URL:-}
    ZALOPAY_RETURN_URL: ${ZALOPAY_RETURN_URL:-${PUBLIC_SCHEME:-https}://${PUBLIC_HOST}/payment/result}
    ZALOPAY_EXPIRE_SECONDS: ${ZALOPAY_EXPIRE_SECONDS:-900}
  volumes:
    - laravel_storage:/var/www/html/storage
  networks:
    - app
    - database
  init: true

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-marketplace_docker}
      MYSQL_USER: ${DB_USERNAME:-marketplace}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Supply a separate private MySQL root password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -Nse "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12

  migrate:
    <<: *backend
    command: [php, artisan, migrate, --force, --no-interaction]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend
    command: [php, artisan, schedule:work, --no-interaction]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: ${COMPOSE_PROJECT_NAME:-secondhand-marketplace}-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
    ports:
      - ${PUBLISH_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80
    volumes:
      - laravel_storage:/var/www/html/storage:ro
    networks:
      app:
        ipv4_address: ${NGINX_INTERNAL_IP:-172.30.14.10}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q --header="Host: $${PUBLIC_HOST}" -O /dev/null http://127.0.0.1/api/v1/health']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

networks:
  app:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.14.0/24}
  database:
    internal: true

volumes:
  mysql_data:
  laravel_storage:
